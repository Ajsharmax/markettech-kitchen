<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'"><title>PDF to PowerPoint — MarketTech</title><style>
:root{--bg:#faf8f3;--ink:#1f2420;--muted:#6b7268;--accent:#2f6b4f;--border:#e7e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:32px 20px 64px}a{color:var(--accent)}.badge{display:inline-block;background:#eef3ee;color:var(--accent);padding:4px 10px;border-radius:20px;font-size:12px}h1{font-size:26px;margin:12px 0 4px}p{color:var(--muted);line-height:1.5}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:20px}.drop{border:2px dashed var(--border);border-radius:10px;padding:36px 16px;text-align:center;cursor:pointer}.drop p{margin:8px 0 0}input[type=file]{display:none}button,select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}button.primary{background:var(--accent);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.info{font-size:14px}.error{color:#9c2b1f;background:#fdecea;padding:10px;border-radius:8px;margin-top:12px}.bar{height:8px;background:#eee;border-radius:8px;margin-top:16px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.small{font-size:13px}</style></head><body><main class="wrap"><a href="/applications">← All applications</a><p><span class="badge">Runs in your browser · No file upload</span></p><h1>PDF to PowerPoint</h1><p>Each PDF page becomes a slide. This preserves the page appearance; text inside slides is not individually editable.</p><section class="card"><div class="drop" id="drop"><strong>Choose a PDF</strong><p>or drag and drop it here</p><input id="file" type="file" accept="application/pdf"></div><p id="info" class="info"></p><div class="row"><label>Image quality <select id="quality"><option value="1.5">Standard</option><option value="2" selected>High</option><option value="3">Maximum</option></select></label><button class="primary" id="go" disabled>Convert to PowerPoint</button></div><div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div><p id="status" class="small" aria-live="polite"></p><p id="error" class="error" hidden></p></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const $=id=>document.getElementById(id);let chosen;function pick(f){$("error").hidden=true;if(!f)return;chosen=null;$("go").disabled=true;const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);if(!isPdf){fail("Please choose a PDF file.");return}if(f.size>157286400){fail("This file is over 150 MB. Split it before converting.");return}chosen=f;$("info").textContent=f.name+" · "+(f.size/1048576).toFixed(1)+" MB";$("go").disabled=false}$("drop").onclick=e=>{if(e.target!==$("file"))$("file").click()};$("file").addEventListener("click",e=>e.stopPropagation());$("file").onchange=e=>pick(e.target.files[0]);$("drop").ondragover=e=>{e.preventDefault()};$("drop").ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])};$("go").onclick=async()=>{if(!chosen)return;$("go").disabled=true;$("bar").hidden=false;$("fill").style.width="0";$("error").hidden=true;try{if(!window.PptxGenJS||!window.pdfjsLib)throw Error("A required library did not load. Refresh and try again.");const pdf=await pdfjsLib.getDocument({data:await chosen.arrayBuffer()}).promise;const pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";const scale=Number($("quality").value);for(let n=1;n<=pdf.numPages;n++){ $("status").textContent="Rendering page "+n+" of "+pdf.numPages+"…";const page=await pdf.getPage(n),vp=page.getViewport({scale});if(vp.width*vp.height>120000000)throw Error("A page is too large. Choose a lower quality setting.");const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;const data=c.toDataURL("image/jpeg",.92),sw=13.333,sh=7.5,a=vp.width/vp.height,sa=sw/sh;let w,h,x,y;if(a>sa){w=sw;h=sw/a;x=0;y=(sh-h)/2}else{h=sh;w=sh*a;x=(sw-w)/2;y=0}pptx.addSlide().addImage({data,x,y,w,h});c.width=c.height=1;$("fill").style.width=Math.round(n/pdf.numPages*90)+"%";await new Promise(r=>setTimeout(r,0))} $("status").textContent="Building PowerPoint…";await pptx.writeFile({fileName:chosen.name.replace(/\.pdf$/i,"")+".pptx"});$("fill").style.width="100%";$("status").textContent="Done — your PowerPoint download has started."}catch(e){fail("Conversion failed: "+(e.message||e))}finally{$("go").disabled=false;$("bar").hidden=true}};</script></body></html>
